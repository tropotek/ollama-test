services:
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:full-cuda  # Official CUDA-enabled image
    volumes:
      - ./models:/models  # Map your local models folder
    ports:
      - "${OLLAMACPP_PORT:-11435}:8080"      # Server API port
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ] # Crucial for RTX 2060 passthrough
    entrypoint: ["/app/llama-server"]
    command: >
      --model /models/qwen3-8b-q4_k_m.gguf
      --host 0.0.0.0
      --port 8080
      --n-gpu-layers 99
      --ctx-size 14960
#      --ctx-size 32768
#      --ctx-size 16216
#      --ctx-size 4096
  


