services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./:/projects
      - ./ollama:/root/.ollama
    restart: unless-stopped
    #environment:
    #  - OLLAMA_CONTEXT_LENGTH=32768
    #  - OLLAMA_CONTEXT_LENGTH=16384
    #  - OLLAMA_CONTEXT_LENGTH=8192
    #  - OLLAMA_CONTEXT_LENGTH=4096
    #  - OLLAMA_CONTEXT_LENGTH=2043
    # enable for older CPU only machines (no GPU)
    # cpus: 8
    # To use Nvidia GPU's you will need to install the "NVIDIA Container Toolkit".
    # https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
    # If using a GPU (NVIDIA), uncomment the lines below):
    deploy:
      resources:
        limits:
          cpus: '4.0'                # Cap CPU to prevent total system lockups
          memory: 16G                 # Cap system RAM allocation
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # access the local url from your browser: http://localhost:3000/
  # in the Admin Connections use the URL: http://ollama:11434/ URL
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    ports:
      - "${OLLAMA_UI_PORT:-3000}:8080"
    volumes:
      - ./docker/open-webui:/app/backend/data
    environment:
      - SEARXNG_PORT=8081
      - SEARXNG_BASE_URL=http://searxng:8081/
      - OLLAMA_BASE_URL=http://ollama:11434
#      - WEBUI_URL=${WEBUI_URL:-http://localhost:3000}
#      - OPENCODE_SERVER_URL=http://localhost:1234
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # enable searxng in Admin Web search settings URL: `http://searxng:8081/search?q=<query>`
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "${SEARXNG_PORT:-18081}:8081"
    volumes:
      - ./docker/searxng-settings.yml:/etc/searxng/settings.yml:ro
      - searxng_data:/app/data
    environment:
      - SEARXNG_PORT=8081
      - SEARXNG_BASE_URL=http://searxng:8081/
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Enable open-terminal in Admin Integrations Open terminal: 'http://open-terminal:18000' and secret from your .env
  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest
    container_name: open-terminal
    ports:
      - "${OPENTERMINAL_PORT:-9900}:18000"
    environment:
      - OPEN_TERMINAL_API_KEY=${OPENTERMINAL_SECRET:-your-secret-password-here}
#      - OPEN_TERMINAL_PACKAGES=
#      - OPEN_TERMINAL_PIP_PACKAGES=
#      - OPEN_TERMINAL_NPM_PACKAGES=
    volumes:
      - ./docker/open-terminal-config.toml:/etc/open-terminal/config.toml:ro
      - open-terminal:/home/user
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:18000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  searxng_data:
  open-terminal: