services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./:/projects
      - ./ollama:/root/.ollama
    environment:
#      - 'OLLAMA_CONTEXT_LENGTH=4096'
      - 'OLLAMA_CONTEXT_LENGTH=2043'
# uncomment the line if you want to use a volume for the data
#      - ollama_data:/root/.ollama
    restart: unless-stopped
    # enable for older CPU only machines (no GPU)
    #cpus: 4
    # To use Nvidia GPU's you will need to install the "NVIDIA Container Toolkit".
    # https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
    # If using a GPU (NVIDIA), uncomment the lines below):
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

