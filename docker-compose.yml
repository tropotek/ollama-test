services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./ollama:/root/.ollama
    # enable to auto download initial llm model on startup
    #  - ./docker/auto-llm.sh:/auto-llm.sh
    #entrypoint: ["/bin/bash", "/auto-llm.sh"]
    restart: unless-stopped
    # enable for older CPU only machines
    #cpus: 8

