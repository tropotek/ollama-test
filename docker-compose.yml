services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile
#    image: ollama-custom:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
      - ./start-ollama.sh:/start-ollama.sh
    entrypoint: ["/bin/bash", "/start-ollama.sh"]
    restart: unless-stopped
    cpus: 8

